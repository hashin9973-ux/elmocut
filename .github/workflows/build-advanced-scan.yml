name: Build ElmoCut advanced scan

on:
  push:
    branches:
      - feature/ping-cli-entrypoint
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile src/elmocut.py src/bridge.py src/constants.py src/gui/main.py src/gui/device.py src/models/device.py src/networking/scanner.py src/networking/killer.py src/tools/utils_gui.py src/ui/ui_main.py

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build ElmoCut executable and installer
        shell: pwsh
        run: |
          @('', '1.1.1', '') | python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-ChildItem -Path output -Filter elmoCut.exe -Recurse | Select-Object -First 1
          if (-not $app) { throw "elmoCut.exe not found in build output" }
          if (-not (Get-ChildItem -Path $app.Directory.FullName -Filter Qt6Network.dll -Recurse)) { throw "Qt6Network.dll missing from packaged app" }
          if (-not (Get-ChildItem -Path $app.Directory.FullName -Filter QtNetwork.pyd -Recurse)) { throw "QtNetwork.pyd missing from packaged app" }
          Get-ChildItem -Recurse output
          Get-ChildItem -File *.exe

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: elmocut-advanced-scan
          path: |
            output/**
            elmoCut* x64.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
