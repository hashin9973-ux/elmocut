name: Verify UI, nickname, and retained device inventory

on:
  push:
    branches:
      - feature/ping-cli-entrypoint
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ping-cli-entrypoint
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile changed Python modules
        run: |
          python -m py_compile src/gui/main.py src/networking/scanner.py src/networking/nicknames.py src/models/device.py src/elmocut.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build executable and installer
        shell: pwsh
        run: |
          @('', '1.1.1', '') | python build.py
      - name: Verify network Qt dependencies
        shell: pwsh
        run: |
          if (!(Test-Path 'output/elmoCut/elmoCut.exe')) { throw 'Executable missing' }
          if (!(Test-Path 'output/elmoCut/PyQt6/Qt6/bin/Qt6Network.dll')) { throw 'Qt6Network.dll missing' }
          if (!(Test-Path 'output/elmoCut/PyQt6/QtNetwork.pyd')) { throw 'QtNetwork.pyd missing' }
          if (!(Test-Path 'output/elmoCut 1.1.1 x64.exe')) { throw 'Installer missing' }
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: elmocut-ui-inventory-fix
          path: output/**
          if-no-files-found: error
          retention-days: 5
